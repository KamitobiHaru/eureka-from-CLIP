data:
  coco_root: ./dataset_annotation
  annotations_dir: annotations_trainval2017/annotations
  embedding_cache: ./data/coco/clip_embeddings

model:
  bert_model_path: ./models/bert-base-uncased
  embed_dim: 512

training:
  batch_size: 128
  epochs: 30
  lr: 0.0003
  weight_decay: 0.01
  temperature: 0.07
  max_grad_norm: 1.0
  amp: true
  num_workers: 16
  checkpoint_dir: ../weights/r8_weight0.75_uniformity2_temporal

temporal:
  d_model: 512
  nhead: 8
  num_layers: 2
  dim_feedforward: 1024
  dropout: 0.1
  max_frames: 16

  sequence_min_len: 3
  sequence_max_len: 10

  # Loss weights
  order_consistency_weight: 1.0    # weight for SymmetricInfoNCE (main contrastive)
  position_prediction_weight: 1  # weight for frame-level position reward
  anchor_mse_weight: 0.05          # light regulariser to keep embedding space stable

  # Optimisation
  temporal_lr: 0.0003
  temporal_warmup: 0

motion:
  cache_dir: ./data/coco/mixed_sequences
