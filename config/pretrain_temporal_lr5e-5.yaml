# Phase 1: COCO temporal pretraining with frozen BERT text encoder.
# Train TemporalTransformer on COCO single-image retrieval.
# CLIP image embeddings and BERT text embeddings are precomputed offline.
data:
  coco_root: ./dataset_annotation
  annotations_dir: annotations_trainval2017/annotations
  embedding_cache: ./data/coco/clip_embeddings

model:
  embed_dim: 512
  bert_model_path: ./models/bert-base-uncased
  temporal:
    d_model: 512
    nhead: 8
    num_layers: 2
    dim_feedforward: 1024
    dropout: 0.1
    max_frames: 16

temporal:
  d_model: 512
  nhead: 8
  num_layers: 2
  dim_feedforward: 1024
  dropout: 0.1
  max_frames: 16
  temporal_lr: 0.0003

training:
  batch_size: 128
  epochs: 30
  lr: 0.0003
  temporal_lr: 0.0003
  weight_decay: 0.01
  temperature: 0.07
  t2i_weight: 0.5
  max_grad_norm: 1.0
  warmup_steps: 5000
  amp: true
  num_workers: 8
  checkpoint_dir: /data2/zsy/weights/clip/temporal_pretrain/lr3e-4
  eval_interval: 3000
  step_level_val: true

# LoRA config must match the BERT checkpoint that was trained.
lora:
  enabled: true
  r: 8
  alpha: 16
  dropout: 0.1
  target_modules: ["key", "query", "value", "output.dense"]

queue:
  max_size: 49152
  mask_stale_texts: false
