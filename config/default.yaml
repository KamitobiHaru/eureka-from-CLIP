data:
  # Root directory containing train2017/, val2017/, annotations/
  coco_root: /run/media/occccce/新加卷1/exactlyCOC
  # Relative path from coco_root to the annotation files
  annotations_dir: annotations_trainval2017/annotations
  # Directory to store precomputed CLIP vision embeddings
  embedding_cache: ./data/coco/clip_embeddings

flickr:
  root: /run/media/occccce/新加卷1/flickr30
  annotation_file: flickr_annotations_30k.csv
  embedding_cache: ./data/flickr30k/clip_embeddings
  # Set false to exclude Flickr30k from training (use only for zero-shot eval)
  train_on: false

clip:
  # Which CLIP model variant to use for vision embeddings.
  #   laion  — open_clip ViT-B/32 trained on LAION-2B (stronger, current default)
  #   openai — OpenAI's original ViT-B/32 trained on WIT-400M
  model: openai

model:
  bert_model_path: ./models/bert-base-uncased
  embed_dim: 512

training:
  batch_size: 64
  epochs: 30
  lr: 0.0003
  weight_decay: 0.01
  temperature: 0.07     # Initial value for learnable CLIP-style logit_scale
  t2i_weight: 0.75       # >0.5 gives more weight to t2i direction (default 0.5 = symmetric)
  uniformity_weight: 1.25  # weight for text uniformity regularizer (0 = disabled)
  warmup_steps: 34536
  max_grad_norm: 1.0
  amp: true
  log_interval: 10
  eval_interval: 6000
  step_level_val: false
  num_workers: 16
  checkpoint_dir: /run/media/occccce/新加卷/checkpoints/legacylora_learnabletemp_cocoonly_lora4target_with_uniform_withweight1_mask_stale_openai

lora:
  enabled: true
  r: 16
  alpha: 32
  dropout: 0.1
  target_modules:
    - "key"
    - "query"
    - "value"
    - "output.dense"

temporal:
  # Training mode: joint | bert_frozen | clip_frozen
  #   joint        — train BERT + TemporalTransformer together (original)
  #   bert_frozen  — load pretrained BERT checkpoint, freeze BERT, train temporal only
  #   clip_frozen  — use frozen CLIP text encoder, train temporal only (baseline)
  mode: joint

  # Path to a Phase-1 BERT checkpoint (required in bert_frozen mode)
  bert_checkpoint: ""

  # Freeze the text encoder in non-joint modes
  freeze_text_encoder: true

  # Model architecture
  d_model: 512
  nhead: 8
  num_layers: 2
  dim_feedforward: 1024
  dropout: 0.1
  max_frames: 16

  # Sequence construction
  sequence_min_len: 3
  sequence_max_len: 10

  # Loss weights
  order_consistency_margin: 0.2
  order_consistency_weight: 0.5
  clip_anchor_weight: 0.3
  text_order_weight: 0.1

  # Optimisation
  temporal_lr: 0.0001
  bert_lr: 0.00003

queue:
  max_size: 49152
  # If true, i2t direction uses only in-batch negatives (avoids stale
  # queue text embeddings from earlier model states). t2i still uses
  # the full queue (images are frozen CLIP → no staleness issue).
  mask_stale_texts: true
