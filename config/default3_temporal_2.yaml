data:
  coco_root: ./dataset_annotation
  annotations_dir: annotations_trainval2017/annotations
  embedding_cache: ./data/coco/clip_embeddings

model:
  bert_model_path: ./models/bert-base-uncased
  embed_dim: 512

training:
  batch_size: 64
  epochs: 20
  lr: 0.0003
  weight_decay: 0.01
  temperature: 0.07
  max_grad_norm: 1.0
  amp: true
  num_workers: 16
  checkpoint_dir: ../weights/r8_weight0.75_uniformity2_temporal_3

temporal:
  d_model: 512
  nhead: 8
  num_layers: 2
  dim_feedforward: 1024
  dropout: 0.1
  max_frames: 16

  sequence_min_len: 3
  sequence_max_len: 10

  # Loss weights
  order_consistency_weight: 1.0    # weight for SymmetricInfoNCE (main contrastive)
  position_prediction_weight: 1.0  # max weight for frame-level position reward (ramped up via warmup)
  anchor_mse_weight: 0.2           # anchors video_emb in CLIP space (light enough to allow temporal adaptation)

  # Position prediction warmup: start from 0, linearly ramp up to position_prediction_weight
  # This lets contrastive alignment converge first before adding temporal supervision.
  pos_warmup:
    start_epoch: 5        # from which epoch to start ramping up (0 = disabled)
    steps: 5000            # gradient steps over which to linearly warm up to full weight
    rate: 1.0              # warmup shape: 1.0=linear, <1=faster early, >1=faster later

  # Optimisation
  temporal_lr: 0.00003
  temporal_warmup: 2000

motion:
  cache_dir: ./data/coco/mixed_sequences
