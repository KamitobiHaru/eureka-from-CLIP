# Ablation: Frozen BERT + MLP projection (replaces LoRA).
# Trained on COCO only, evaluated on Flickr30k zero-shot.
# Hyperparameters match ablation/ours.yaml exactly.
data:
  coco_root: ./dataset_annotation
  annotations_dir: annotations_trainval2017/annotations
  embedding_cache: ./data/coco/clip_embeddings

flickr:
  root: ./dataset_annotation
  annotation_file: flickr_annotations_30k.csv
  embedding_cache: ./data/flickr30k/clip_embeddings
  train_on: false

clip:
  model: openai

seed: 42

model:
  bert_model_path: ./models/bert-base-uncased
  embed_dim: 512

text_encoder:
  type: mlp
  bert_model_path: ./models/bert-base-uncased
  mlp_hidden: 704

training:
  batch_size: 128
  epochs: 30
  lr: 0.0003
  weight_decay: 0.01
  temperature: 0.07
  t2i_weight: 0.75
  uniformity_weight: 0
  warmup_steps: 34536
  max_grad_norm: 1.0
  amp: true
  log_interval: 10
  step_level_val: false
  num_workers: 16
  checkpoint_dir: /run/media/occccce/D/checkpoints/ablation_mlp

# LoRA disabled — MLP projection head provides trainable parameters instead.
lora:
  enabled: false

queue:
  max_size: 49152
  mask_stale_texts: true
