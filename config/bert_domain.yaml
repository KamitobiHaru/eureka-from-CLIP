# Stage 1: Domain-adapt BERT to MSR-VTT video language.
# Video: frozen CLIP keyframes → mean pool (frozen, never stale in queue)
# Text:  BERT + LoRA (trainable), init from Flickr30k checkpoint
# Queue: mask_stale_texts=True → t2i gets B+Q negatives (videos never stale)
data:
  msrvtt:
    root: /data2/zsy/datasets/MSR-VTT
    train_annotation: msrvtt_train_9k.json
    frame_cache: ./data/msrvtt/clip_keyframes
  msvd:
    annotation: ./data/msvd/msvd_all.json
    frame_cache: ./data/msvd/clip_keyframes

model:
  embed_dim: 512
  bert_model_path: ./models/bert-base-uncased

training:
  batch_size: 128
  epochs: 30
  lr: 0.000001
  t2i_weight: 0.75
  weight_decay: 0.01
  temperature: 0.07
  max_grad_norm: 1.0
  warmup_steps: 34536
  amp: true
  num_workers: 8
  checkpoint_dir: /data2/zsy/weights/clip/bert_domain_stage1_1e-6

lora:
  enabled: true
  r: 8
  alpha: 16
  dropout: 0.1
  target_modules: ["key", "query", "value", "output.dense"]

queue:
  enabled: true
  max_size: 49152
  mask_stale_texts: true

checkpoint:
  bert_pretrain: /data2/zsy/weights/clip/no_uniform_seed42/ours/bert_epoch26_t2i60.5.pt
