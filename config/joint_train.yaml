# Phase 2: Joint LoRA BERT + Temporal training on MSR-VTT.
# Validate generalization on MSVD every epoch.
# Temporal module is initialized from Phase 1 pretraining.
# BERT is initialized from the pretrained retrieval checkpoint.
data:
  msrvtt:
    root: /data2/zsy/datasets/MSR-VTT
    train_annotation: msrvtt_train_9k.json
    test_annotation: msrvtt_test_1k.json
    frame_cache: ./data/msrvtt/clip_keyframes
  msvd:
    annotation: ./data/msvd/msvd_all.json
    frame_cache: ./data/msvd/clip_keyframes

model:
  embed_dim: 512
  bert_model_path: ./models/bert-base-uncased
  temporal:
    d_model: 512
    nhead: 8
    num_layers: 2
    dim_feedforward: 1024
    dropout: 0.1
    max_frames: 16

training:
  batch_size: 64
  epochs: 20
  lr: 5e-05
  temporal_lr: 0.0001
  t2i_weight: 0.75
  weight_decay: 0.01
  temperature: 0.07
  max_grad_norm: 1.0
  warmup_steps: 2000
  amp: true
  num_workers: 8
  checkpoint_dir: ./checkpoints/joint_train

lora:
  enabled: true
  r: 8
  alpha: 16
  dropout: 0.1
  target_modules: ["key", "query", "value", "output.dense"]

queue:
  enabled: true
  max_size: 49152
  mask_stale_texts: true

checkpoint:
  temporal_pretrain: ./checkpoints/pretrain_temporal/best_temporal.pt
  bert_pretrain: ./checkpoints/bert_pretrain/best.pt
