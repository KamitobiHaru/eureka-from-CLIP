# Stage 1b: Mixed COCO + MSR-VTT BERT domain adaptation.
# COCO (single-frame images, treated as 1-frame "videos") grounds BERT in the
# original image domain (prevent forgetting). MSR-VTT adapts BERT to video
# language. Both use frozen CLIP vision → never stale in queue.
#
# Datasets are concatenated at their natural ratio (~3.3:1 COCO:MSR-VTT).
# The combined loader sees all ~771K pairs/epoch → ~12045 batches at bs=64.
data:
  coco:
    root: ./dataset_annotation
    annotations_dir: annotations_trainval2017/annotations
    embedding_cache: ./data/coco/clip_embeddings
  msrvtt:
    root: ./datasets/MSR-VTT
    train_annotation: msrvtt_train_9k.json
    frame_cache: ./data/msrvtt/clip_keyframes
  msvd:
    annotation: ./data/msvd/msvd_all.json
    frame_cache: ./data/msvd/clip_keyframes
  flickr:
    # Only used for evaluation, not training
    root: ./dataset_annotation
    annotation_file: flickr_annotations_30k.csv

model:
  embed_dim: 512
  bert_model_path: ./models/bert-base-uncased

training:
  batch_size: 128
  epochs: 30
  lr: 0.0003
  t2i_weight: 0.75
  weight_decay: 0.01
  temperature: 0.07
  max_grad_norm: 1.0
  warmup_steps: 34536
  amp: true
  num_workers: 8
  # Natural ratio: COCO ~591K / MSR-VTT ~180K ≈ 77% COCO, 23% MSR-VTT
  checkpoint_dir: ./checkpoints/bert_mixed_stage1

lora:
  enabled: true
  r: 8
  alpha: 16
  dropout: 0.1
  target_modules: ["key", "query", "value", "output.dense"]

queue:
  enabled: true
  max_size: 49152
  mask_stale_texts: true

# Start from BERT-base-uncased (no Flickr30k retrieval checkpoint).
# The BertEncoder loads raw bert-base-uncased weights, and LoRA + projection
# head are randomly initialised — COCO is in the training mix from the start.
# checkpoint:
#   bert_pretrain: /path/to/checkpoint.pt
