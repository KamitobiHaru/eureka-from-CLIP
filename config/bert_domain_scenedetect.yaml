# Stage 1: Domain-adapt BERT to MSR-VTT video language.
# Video: frozen CLIP keyframes (scene-detected) → mean pool
# Text:  BERT + LoRA (trainable), init from Flickr30k checkpoint
# Queue: mask_stale_texts=True → t2i gets B+Q negatives (videos never stale)
data:
  msrvtt:
    root: /run/media/occccce/E/MSR-VTT
    train_annotation: msrvtt_train_9k.json
    frame_cache: ./data/msrvtt/clip_keyframes_scenedetect
  msvd:
    annotation: ./data/msvd/msvd_test_only.json
    frame_cache: ./data/msvd/clip_keyframes_scenedetect

model:
  embed_dim: 512
  bert_model_path: /run/media/occccce/D/models/bert-base-uncased

training:
  batch_size: 128
  epochs: 30
  lr: 0.00001
  t2i_weight: 0.75
  weight_decay: 0.01
  temperature: 0.07
  max_grad_norm: 1.0
  warmup_steps: 4000
  amp: true
  num_workers: 8
  checkpoint_dir: /run/media/occccce/D/checkpoints/bert_domain_stack_lora_scenedetect

lora:
  enabled: true
  r: 8
  alpha: 16
  dropout: 0.1
  target_modules: ["key", "query", "value", "output.dense"]

stack_lora:
  r: 2
  alpha: 4
  dropout: 0.1
  target_modules: ["key", "query", "value", "output.dense"]

queue:
  enabled: true
  max_size: 49152
  mask_stale_texts: true

checkpoint:
  bert_pretrain: /run/media/occccce/D/checkpoints/bert_epoch26_t2i60.5.pt
